repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [ --maxkb=1024 ]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-skills
        name: check skills
        entry: uv run evals/check_skills.py
        language: system
        files: ^(skills/|evals/check_skills\.py|\.claude-plugin/|\.codex-plugin/|\.cursor-plugin/|\.agents/plugins/|plugins/python-powers$)
        types: []
        pass_filenames: false
      - id: test-eval-grader
        name: test eval grader
        entry: uv run --python '>=3.14' python -m unittest discover -s evals -p test_run_evals.py
        language: system
        files: ^(evals/(cases\.json|run_evals\.py|test_run_evals\.py|fixture/)|skills/postgres-database/references/testing\.md$)
        pass_filenames: false
