repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [ --maxkb=1024 ]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-skills
        name: check skills
        entry: uv run evals/check_skills.py
        language: system
        files: ^(skills/|evals/check_skills\.py|\.claude-plugin/|\.codex-plugin/|\.cursor-plugin/|\.agents/plugins/)
        pass_filenames: false
